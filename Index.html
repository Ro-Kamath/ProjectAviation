<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Aviation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <h1>Project Aviation</h1>
    <p>Build a realistic airline empire from a physical 3D office desk, managing MTOW, thin profit margins, and true market uncertainty.</p>
    <button id="open-modal">Show Interest</button>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button id="close-modal" class="close" aria-label="Close">&times;</button>
      <h2>Get notified at launch</h2>
      <form id="signup-form">
        <input type="email" id="email" placeholder="you@example.com" required />
        <button type="submit">Notify me</button>
      </form>
      <p id="status" role="status"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
